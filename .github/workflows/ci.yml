# CI for pinpoint-live: the same two checks `bun test` / `bun run type-check` run locally.
# Runs on every pull request and on pushes to main. A PR that reports no checks at all means GitHub
# could not build its test-merge (a conflict with the base) — resolve that before waiting on CI.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run type-check
      - run: bun test
